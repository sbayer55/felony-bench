name: Refresh incidents

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: Maximum incidents to add this run
        default: '10'
        required: false
      since:
        description: Ignore candidates dated before (YYYY-MM-DD)
        default: ''
        required: false
      dry_run:
        description: Preview only, do not commit
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Check secrets
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::DATABASE_URL secret is not set; skipping refresh until the database is hosted."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # Inserts straight into Postgres in one transaction; running API instances reload via NOTIFY.
      - name: Research, validate, insert
        if: steps.guard.outputs.ready == 'true'
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS="--max=${{ github.event.inputs.max || '10' }}"
          if [ -n "${{ github.event.inputs.since }}" ]; then ARGS="$ARGS --since=${{ github.event.inputs.since }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          pnpm refresh $ARGS
