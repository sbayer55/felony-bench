# Production stack on the EC2 host (see infra/README.md). Run through deploy/dc, which
# points compose at the secrets in /data/felony/.env:
#   /opt/felony/src/deploy/dc ps
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: felony
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: felony
    volumes:
      - /data/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felony -d felony"]
      interval: 2s
      timeout: 3s
      retries: 30
    shm_size: 128mb
    restart: unless-stopped

  api:
    image: ${IMAGE:?}:${TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://felony:${POSTGRES_PASSWORD}@db:5432/felony
      ADMIN_TOKEN: ${ADMIN_TOKEN:?}
      IP_SALT: ${IP_SALT:?}
      TRUST_PROXY: "true"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [api]
    environment:
      DOMAIN: ${DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy/data:/data
      - /data/caddy/config:/config
    restart: unless-stopped

  # Daily via felony-refresh.timer (refresh.sh), never started by `up`.
  refresh:
    image: ${IMAGE:?}-refresh:${TAG:-latest}
    profiles: [refresh]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://felony:${POSTGRES_PASSWORD}@db:5432/felony
