name: CI

# Verifies, builds, and on main publishes the Docker images that compose.prod.yml pulls, then deploys to the EC2 host (infra/).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: felony
          POSTGRES_PASSWORD: felony
          POSTGRES_DB: felony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U felony" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://felony:felony@localhost:5432/felony
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Builds both images natively for amd64 and arm64 on every run. On main, pushes each by digest; docker-merge tags them.
  docker:
    runs-on: ${{ matrix.runner }}
    needs: [web, api]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, refresh]
        platform: [amd64, arm64]
        include:
          - { target: api, image: felony-bench }
          - { target: refresh, image: felony-bench-refresh }
          - { platform: amd64, runner: ubuntu-latest }
          - { platform: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          outputs: ${{ github.event_name == 'push' && format('type=image,name=ghcr.io/{0}/{1},push-by-digest=true,name-canonical=true,push=true', github.repository_owner, matrix.image) || 'type=cacheonly' }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}-${{ matrix.platform }}
      - if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.target }}-${{ matrix.platform }}
          path: /tmp/digests/*
          retention-days: 1

  # Joins the per-arch images into one multi-arch tag set (ghcr.io/<owner>/felony-bench[-refresh]: latest, sha-<commit>).
  docker-merge:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { target: api, image: felony-bench }
          - { target: refresh, image: felony-bench-refresh }
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.target }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          tags=(); while read -r t; do tags+=(-t "$t"); done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          sources=(); for d in *; do sources+=("$IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

  # Runs deploy/deploy.sh on the EC2 host through SSM. Skipped until the AWS_DEPLOY_ROLE_ARN variable exists.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    needs: [docker-merge]
    timeout-minutes: 20
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy ${{ github.sha }}
        run: |
          cmd=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets Key=tag:App,Values=felony-bench \
            --parameters "commands=[\"/opt/felony/src/deploy/deploy.sh $GITHUB_SHA\"]" \
            --timeout-seconds 900 \
            --query Command.CommandId --output text)
          echo "command $cmd"
          for _ in $(seq 1 180); do
            sleep 5
            read -r instance status < <(aws ssm list-command-invocations --command-id "$cmd" \
              --query 'CommandInvocations[0].[InstanceId,Status]' --output text)
            case "$status" in Pending|InProgress|Delayed|None|"") continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "status: $status"
          [ "$status" = Success ]
