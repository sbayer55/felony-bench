name: Secret scan

# Push and PR runs scan only the new commits; manual runs scan the full history.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Verified only: the local Postgres credentials in CI and compose are intentional and can't be verified.
      - uses: trufflesecurity/trufflehog@v3.97.9
        with:
          extra_args: --results=verified
