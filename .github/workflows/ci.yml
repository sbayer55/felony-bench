name: CI

# Verify and build on every push/PR. On main, push arm64 images to GHCR and deploy to the EC2 host (infra/).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: felony
          POSTGRES_PASSWORD: felony
          POSTGRES_DB: felony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U felony" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://felony:felony@localhost:5432/felony
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  docker:
    runs-on: ubuntu-24.04-arm
    needs: [web, api]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [app, refresh]
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "${{ matrix.target }}" = refresh ]; then image="$image-refresh"; fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  # Runs deploy/deploy.sh on the host through SSM. Skipped until the AWS_DEPLOY_ROLE_ARN variable exists.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 20
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy ${{ github.sha }}
        run: |
          cmd=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets Key=tag:App,Values=felony-bench \
            --parameters "commands=[\"/opt/felony/src/deploy/deploy.sh $GITHUB_SHA\"]" \
            --timeout-seconds 900 \
            --query Command.CommandId --output text)
          echo "command $cmd"
          for _ in $(seq 1 180); do
            sleep 5
            read -r instance status < <(aws ssm list-command-invocations --command-id "$cmd" \
              --query 'CommandInvocations[0].[InstanceId,Status]' --output text)
            case "$status" in Pending|InProgress|Delayed|None|"") continue ;; esac
            break
          done
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "status: $status"
          [ "$status" = Success ]
