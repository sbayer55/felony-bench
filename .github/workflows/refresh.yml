name: Refresh incidents

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: Maximum incidents to add this run
        default: '10'
        required: false
      since:
        description: Ignore candidates dated before (YYYY-MM-DD)
        default: ''
        required: false
      dry_run:
        description: Preview only, do not commit
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Research and validate
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--max=${{ github.event.inputs.max || '10' }}"
          if [ -n "${{ github.event.inputs.since }}" ]; then ARGS="$ARGS --since=${{ github.event.inputs.since }}"; fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          pnpm refresh $ARGS

      - name: Verify
        run: pnpm check

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet -- src/data; then
            echo "No changes."
            exit 0
          fi
          git config user.name "felony-bench-bot"
          git config user.email "felony-bench-bot@users.noreply.github.com"
          git add src/data
          git commit -m "data: refresh $(date -u +%F) (+${{ steps.refresh.outputs.added || 0 }} incidents)"
          git push
